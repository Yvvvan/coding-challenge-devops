services:
  api:
    build:
      context: .
      dockerfile: Source/src/CodingChallenge.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Data Source=/app/data/codingchallenge.db
    ports:
      - "5220:8080"
    volumes:
      - codingchallenge-data:/app/data

  web:
    build:
      context: .
      dockerfile: Source/src/CodingChallenge.Web/Dockerfile
    environment:
      ApiBaseUrl: http://api:8080
    ports:
      - "5001:8080"
    volumes:
      - web-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      - api

volumes:
  codingchallenge-data:
  web-data-protection:
