name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Source/src/**/*.csproj
            Source/tests/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore CodingChallenge.slnx

      - name: Build solution
        run: dotnet build CodingChallenge.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/CodingChallenge.Tests/CodingChallenge.Tests.csproj --configuration Release --no-build --verbosity normal

  container-build:
    name: Verify Docker images
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API and Web images
        run: docker compose build
